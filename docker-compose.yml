# Levanta SQL Server y MongoDB en contenedores para desarrollo local.
#   docker compose up -d
# Luego ejecutar database/sqlserver.sql (ver README) e iniciar la API con npm run dev.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mythos-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:-Mythos#2026}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  mongodb:
    image: mongo:7
    container_name: mythos-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  sqlserver-data:
  mongo-data:
